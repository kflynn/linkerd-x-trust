name: release

# Build the linkerd-x-trust CLI for every supported platform and attach
# the binaries to a new draft GitHub release, whenever a release tag
# (v*) is pushed. The draft must be reviewed and published by hand.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Static binaries so the release artifacts don't depend on a libc
  # (or on the build container's glibc version).
  CGO_ENABLED: 0

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: windows
            goarch: arm64
            ext: '.exe'
    steps:
      # Pinned by commit SHA; bump comments when updating.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o "dist/linkerd-x-trust-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}${{ matrix.ext }}" \
            ./cmd/

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linkerd-x-trust-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  build-darwin:
    name: Build darwin (universal)
    # lipo, which merges the amd64 and arm64 builds into one fat
    # binary, only exists on macOS.
    runs-on: macos-latest
    steps:
      # Pinned by commit SHA; bump comments when updating.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build universal binary
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "linkerd-x-trust-${arch}" \
              ./cmd/
          done
          lipo -create -output "dist/linkerd-x-trust-${GITHUB_REF_NAME}-darwin" \
            linkerd-x-trust-amd64 linkerd-x-trust-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linkerd-x-trust-darwin
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: [build, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum linkerd-x-trust-* | tee SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/linkerd-x-trust-*
            dist/SHA256SUMS.txt
