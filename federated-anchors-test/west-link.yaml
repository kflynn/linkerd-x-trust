apiVersion: v1
data:
  kubeconfig: 
kind: Secret
metadata:
  name: cluster-credentials-west
  namespace: linkerd-multicluster
type: mirror.linkerd.io/remote-kubeconfig
---
apiVersion: v1
data:
  kubeconfig: 
kind: Secret
metadata:
  annotations:
    multicluster.linkerd.io/cluster-domain: cluster.local
    multicluster.linkerd.io/trust-domain: cluster.local
  labels:
    multicluster.linkerd.io/cluster-name: west
  name: cluster-credentials-west
  namespace: linkerd
type: mirror.linkerd.io/remote-kubeconfig
---
apiVersion: multicluster.linkerd.io/v1alpha3
kind: Link
metadata:
  annotations:
    linkerd.io/created-by: linkerd/cli edge-26.6.3
  name: west
  namespace: linkerd-multicluster
spec:
  clusterCredentialsSecret: cluster-credentials-west
  federatedServiceSelector:
    matchLabels:
      mirror.linkerd.io/federated: member
  gatewayAddress: 192.168.97.4
  gatewayIdentity: linkerd-gateway.linkerd-multicluster.serviceaccount.identity.linkerd.cluster.local
  gatewayPort: "4143"
  probeSpec:
    path: /ready
    period: 3s
    port: "4191"
  remoteDiscoverySelector:
    matchLabels:
      mirror.linkerd.io/exported: remote-discovery
  selector:
    matchLabels:
      mirror.linkerd.io/exported: "true"
  targetClusterDomain: cluster.local
  targetClusterLinkerdNamespace: linkerd
  targetClusterName: west
status: {}
---
